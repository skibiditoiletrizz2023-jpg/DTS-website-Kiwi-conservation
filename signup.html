<body>
<ul>
    <header>
        <div style="float:left">
            <a href="index.html"><img src="images/tiki .jpeg" alt="logo" width="80" height="70"></a>
        </div>
    </header>

    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>

    <div style="float:right">
        <li><a href="signup.html">Sign Up</a></li>
    </div>
</ul>

<main class="page">
    <h1 class="heading-box">Join the Kiwi Conservation Effort</h1>

    <div class="centerts">
        <form action="submit.html" method="get">
            <p for="email">Email</p>
            <input type="email" id="email" name="email" required>

            <p for="phone">Phone number</p>
            <input type="tel" id="phone" name="phone" required>

            <p for="address">Address</p>
            <input type="text" id="address" name="address" required>

            <p for="birthdate">Birth date</p>
            <input type="date" id="birthdate" name="birthdate" required>

            <div class="button-container">
                <button type="submit" class="butons">Confirm</button>
            </div>
        </form>
    </div>
</main>
